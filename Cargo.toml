[workspace]
members = ["crates/fmp-backend", "crates/fmp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0"
authors = ["Luke Wilkinson <wilkinsonluke@proton.me>"]
repository = "https://codeberg.org/lwilko/fmp"
version = "0.1.0"

[workspace.dependencies]
fmp_backend = { path = "./crates/fmp-backend", version = "0.1.0" }
fmp = { path = "./crates/fmp", version = "0.1.0" }


sequoia-openpgp = "2.4.2"
tempfile = "3.27.0"
serde_json= "1.0.154"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
zeroize = "1"
rand = "0.10.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4.45"
fs2 = "0.4"
dirs = "7.0.0"
arboard = "3.7"
zxcvbn = "3.1.1"
rand_core = { version = "0.9", features = ["os_rng"] }